name: Regioverkenning - officiële gegevens vernieuwen
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install openpyxl==3.1.5
      - name: Officiële bronnen ophalen
        run: |
          curl --fail --location --retry 2 --max-time 420 'https://www.insee.fr/fr/statistiques/fichier/8217527/DS_BPE_CSV_FR.zip' -o "$RUNNER_TEMP/bpe.zip"
          curl --fail --location --retry 2 --max-time 180 'https://www.insee.fr/fr/statistiques/fichier/8571524/fichier_diffusion_2026.xlsx' -o "$RUNNER_TEMP/density.xlsx"
      - name: Schema en volledigheid controleren
        run: python scripts/import-region-data.py "$RUNNER_TEMP/bpe.zip" "$RUNNER_TEMP/density.xlsx"
      - name: Snapshot bewaren
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/region-data.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Refresh official region exploration sources'
          git push
